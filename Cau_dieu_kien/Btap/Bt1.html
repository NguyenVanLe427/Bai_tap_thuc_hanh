<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Product</title>

    <link rel="stylesheet" href="Bt1.css">
</head>

<body>
    <h1>New Product</h1>
    <hr>
    <form name="frm">
        <label>
            Product Name
            <input type="text" name="pname" id="pname">
        </label>

        <label>
            Quantity
            <input type="text" name="qty" id="qty">
        </label>
        <br><br>
        <label>
            Unit Price
            <input type="text" name="price" id="up">
        </label>

        <label>
            Discount
            <input type="text" name="dc" id="dc">
        </label>
        <br><br>
        <button type="button" onclick="sell()">Sell</button>
        <button type="button">Cancel</button>

    </form>
    <br>
    <table id="tbl">
        <thead>
            <tr>
                <th>ID</th>
                <th>Product Name</th>
                <th>Quantity</th>
                <th>Unit Price</th>
                <th>Discount</th>
                <th>Subtotal</th>
            </tr>
        </thead>
        <tbody>
        </tbody>

    </table>

    <script src="Bt1.js"></script>

</body>

</html>
