<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEB ABOUT SOFTSKILL</title>
    <link rel="stylesheet" href="Softskill.css">
</head>

<body>
    <h1 style="text-align: center;">Hãy Lựa Chọn Kỹ Năng Bạn Muốn Cải Thiện</h1>
    <h3>1) Kỹ năng giao tiếp:</h3>
    <ul>
        <li>
            <button>Nghe hiểu người khác</button>
        </li>
        <li>
            <button>Trình bày ý kiến rõ ràng</button>
        </li>
        <li>
            <button>Thuyết phục người khác</button>
        </li>
    </ul>
    <h3>2) Kỹ năng thuyết trình:</h3>
    <ul>
        <li>
            <button>Chuẩn bị bài thuyết trình</button>
        </li>
        <li>
            <button>Trình bày trước khán giả</button>
        </li>
        <li>
            <button>Tư thế phong thái khi thuyết trình</button>
        </li>
    </ul>
    <h3>3) Kỹ năng làm việc nhóm:</h3>
    <ul>
        <li>
            <button>Phối hợp với đồng nghiệp</button>
        </li>
        <li>
            <button>Đóng góp ý kiến xây dựng</button>
        </li>
        <li>
            <button>Giải quyết xung đột trong nhóm</button>
        </li>
    </ul>
</body>

</html>
